<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food Tracker Admin</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><h1>🛠️ Food Tracker Admin</h1><button id="logout" class="secondary">Logout</button></header>
<main class="container">
<section class="card"><h2>Overview</h2><div id="stats" class="stats-grid"></div></section>
<section class="card"><h2>Create User</h2>
<form id="createUser" class="row">
<input id="newName" placeholder="Name" required><input id="newEmail" type="email" placeholder="Email" required>
<input id="newPassword" type="password" placeholder="Password (8+ chars)" minlength="8" required>
<select id="newRole"><option value="user">User</option><option value="admin">Admin</option></select>
<button class="btn">Create</button></form><p id="msg"></p></section>
<section class="card"><h2>Users</h2><div class="table-wrap"><table>
<thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Records</th><th>Action</th></tr></thead>
<tbody id="users"></tbody></table></div></section>
<section class="card"><h2>All Meal Records</h2><div class="table-wrap"><table>
<thead><tr><th>Date</th><th>User</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th><th>Snacks</th><th>Notes</th><th>Action</th></tr></thead>
<tbody id="meals"></tbody></table></div></section>
</main><script src="js/admin.js"></script></body></html>
